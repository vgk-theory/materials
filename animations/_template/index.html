<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Название явления</title>
  <!-- Только относительные пути и локальные файлы: никаких внешних CDN.
       Пути ниже рассчитаны на папку animations/<тема>/<явление>/.
       Для явления в подтеме добавьте по одному «../» на каждый уровень вложенности. -->
  <link rel="stylesheet" href="../../shared/style.css">
</head>
<body>
<main>
  <p class="breadcrumbs"><a href="../../../index.html">Главная</a> / <a href="../../index.html">Анимации</a> / Название явления</p>
  <h1>Название явления</h1>
  <p class="muted">Одно-два предложения: что показано. Источник: глава монографии и/или видео.</p>

  <canvas id="stage" class="stage" width="800" height="400"></canvas>

  <div class="controls">
    <label>Параметр
      <input id="param" type="range" min="1" max="10" step="1" value="5">
      <output id="param-value">5</output>
    </label>
  </div>
</main>
<script src="../../shared/site.js"></script>
<script src="script.js"></script>
</body>
</html>
