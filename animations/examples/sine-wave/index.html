<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Синусоида (пример)</title>
  <link rel="stylesheet" href="../../shared/style.css">
</head>
<body>
<main>
  <p class="breadcrumbs"><a href="../../../index.html">Главная</a> / <a href="../../index.html">Анимации</a> / Синусоида (пример)</p>
  <h1>Синусоида (пример)</h1>
  <p class="notice">Это технический пример для проверки сайта и каталога. Он не относится к теории.</p>

  <canvas id="stage" class="stage" width="800" height="400"></canvas>

  <div class="controls">
    <label>Амплитуда
      <input id="amplitude" type="range" min="10" max="180" step="1" value="120">
      <output id="amplitude-value">120</output>
    </label>
    <label>Число периодов
      <input id="periods" type="range" min="1" max="10" step="1" value="3">
      <output id="periods-value">3</output>
    </label>
    <label>Скорость
      <input id="speed" type="range" min="0" max="5" step="0.5" value="1">
      <output id="speed-value">1</output>
    </label>
  </div>
</main>
<script src="../../shared/site.js"></script>
<script src="script.js"></script>
</body>
</html>
